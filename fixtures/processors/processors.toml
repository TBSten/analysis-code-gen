# 移植・検証する既存 Processor と、入力カタログの源 ②（実プロジェクト）の唯一の一覧（ADR-019）
# 検査: python3 scripts/processors.py check
# 版を上げるときは、このファイルと ADR-019 の表を同時に直す。
#   bridge / native: "required"（合格ラインに入る）/ "optional"（任意）/ "none"
#   kmp: Processor が KMP の commonMain などで使えるか
#   source: 上流の出所。GitHub は "github:<owner>/<repo>@<40 桁の SHA>"、
#           monorepo などコミットを指せないものは "maven-sources:<座標>:<版>"

[[processor]]
id = "CRM"
name = "cream.kt"
artifacts = ["me.tbsten.cream:cream-ksp"]
version = "0.10.0"
source = "github:TBSten/cream@2162ec8d5261e3cb047de6825545f589102caab5"
tag = "v0.10.0"
license = "Apache-2.0"
bridge = "required"
native = "required"
kmp = true
notes = "外部の利用プロジェクトが無いため、源 ② は cream.kt の test モジュールで代える"

[[processor]]
id = "MSH"
name = "Moshi codegen"
artifacts = ["com.squareup.moshi:moshi-kotlin-codegen"]
version = "1.15.2"
source = "github:square/moshi@7f957b18ea123b7bb2ffc9d3c079e680eecf15e1"
tag = "1.15.2"
license = "Apache-2.0"
bridge = "required"
native = "required"
kmp = false
notes = "1.15.2 は main の KSP2 修正（#1870・#1874）を含まない。2.0.0-alpha.1 は Maven Central 未公開"

[[processor]]
id = "KOI"
name = "Koin Annotations (KSP)"
artifacts = ["io.insert-koin:koin-ksp-compiler"]
version = "2.3.1"
source = "github:InsertKoinIO/koin-annotations@1d4c1af21faaccdfef0c433e49ee40d9b013e7f9"
tag = "2.3.1"
license = "Apache-2.0"
bridge = "required"
native = "required"
kmp = true
notes = "KSP 版は上流で非推奨（Koin Compiler Plugin へ移行）。Koin + cream.kt の組み合わせ検証のため残す"

[[processor]]
id = "KIN"
name = "kotlin-inject"
artifacts = ["me.tatarka.inject:kotlin-inject-compiler-ksp"]
version = "0.9.0"
source = "github:evant/kotlin-inject@5314482de3c7a12369daf8384a3a5a3894a72313"
tag = "v0.9.0"
license = "Apache-2.0"
bridge = "required"
native = "optional"
kmp = true
notes = "KSP2 のみ対応。未解決の KSP2 issue #493・#497"

[[processor]]
id = "DAG"
name = "Dagger / Hilt"
artifacts = ["com.google.dagger:dagger-compiler", "com.google.dagger:hilt-compiler", "com.google.dagger:hilt-android-compiler"]
version = "2.60.1"
source = "github:google/dagger@f7a89b6cea7d47167f2d5f9912f61f3fee333d88"
tag = "dagger-2.60.1"
license = "Apache-2.0"
bridge = "required"
native = "optional"
kmp = false
notes = "XProcessing 経由で KSP を使う。Hilt は Android フィクスチャと Google Maven が要る"

[[processor]]
id = "ROM"
name = "Room"
artifacts = ["androidx.room:room-compiler"]
version = "2.8.5"
source = "maven-sources:androidx.room:room-compiler:2.8.5"
tag = ""
license = "Apache-2.0"
bridge = "required"
native = "none"
kmp = true
notes = "Google Maven が要る。Room 3（androidx.room3）は候補置き場 CB-1"

