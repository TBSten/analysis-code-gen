# LIC-01: 移植ファイルの出所記録・著作権表示・NOTICE の検査（ADR-018）
name: LIC-01 provenance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lic-01:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test of the checker
        run: python3 scripts/lic01/test_check_provenance.py
      - name: Fetch pinned upstreams when ported files exist
        id: upstream
        run: |
          # porting/<id>/UPSTREAM.properties ごとに、移植済みファイルがあればその上流の固定コミットを取る（R5）
          args=""
          for props in porting/*/UPSTREAM.properties; do
            id=$(grep '^id=' "$props" | cut -d= -f2)
            repo=$(grep '^repository=' "$props" | cut -d= -f2)
            owner_repo=$(echo "$repo" | sed -E 's#https://github.com/##; s#/$##')
            if grep -rIl --include='*.kt' --include='*.kts' --include='*.java' "Ported-From: ${owner_repo}@" . \
                 --exclude-dir=.git --exclude-dir=porting --exclude-dir=lic01 --exclude-dir=build | grep -q .; then
              commit=$(grep '^commit=' "$props" | cut -d= -f2)
              prev=$(grep '^previous_commits=' "$props" | cut -d= -f2 | tr ',' ' ')
              dir="$RUNNER_TEMP/upstream-$id"
              git init -q "$dir"
              git -C "$dir" remote add origin "$repo.git"
              for c in $commit $prev; do git -C "$dir" fetch -q --depth 1 --filter=blob:none origin "$c"; done
              args="$args --upstream-dir $id=$dir"
            fi
          done
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: LIC-01
        run: python3 scripts/lic01/check_provenance.py ${{ steps.upstream.outputs.args }}
