# 最小の CI（足場 ACG-26）。マトリクス・定期実行・docs などは ACG-28 で広げる
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # ケース ID 整合チェック（:quality:checkCaseIds、ADR-030）が origin/main の quality/case-status.csv と比べるため
      - name: Fetch main for case status comparison
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      # quality/test-cases.csv は test-case-inventory.md から生成する。手で直した・再生成し忘れたら落とす
      - name: Check test-cases.csv is generated from the inventory
        run: |
          python3 quality/scripts/gen_csv.py > /dev/null
          git diff --exit-code -- quality/
      # 進捗レポートのコマンド（ACG-30、ADR-032）
      - name: progress_report の自己テスト
        run: python3 scripts/progress/test_progress_report.py
      - name: Build and test
        run: ./gradlew build --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/test-results/**/*.xml"
          if-no-files-found: ignore
