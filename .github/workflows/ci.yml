# 最小の CI（足場 ACG-26）。マトリクス・定期実行・docs などは ACG-28 で広げる
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: TEMP probe AA repositories (ACG-34, remove before merge)
        run: |
          for base in https://redirector.kotlinlang.org/maven/kotlin-ide-plugin-dependencies https://packages.jetbrains.team/maven/p/kt/kotlin-ide-plugin-dependencies https://packages.jetbrains.team/maven/p/ij/intellij-dependencies https://redirector.kotlinlang.org/maven/bootstrap; do
            echo "=== $base"
            curl -sL "$base/org/jetbrains/kotlin/analysis-api-for-ide/maven-metadata.xml" | grep -o "<version>2\.[34][^<]*</version>" | grep -v "dev-" | sort -V | tr '\n' ' ' || true; echo
          done
      - name: Build and test
        run: ./gradlew build --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/test-results/**/*.xml"
          if-no-files-found: ignore
