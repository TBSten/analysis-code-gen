# 毎時の PBT（ACG-40、ADR-022）。PR ごとには回さない（PR では回帰 seed と固定 seed だけが ./gradlew build の中で回る）。
# - 新しい seed で、予算 30 分（上限 40 分）に収まる試行数を自動で決める。1 試行の時間は .pbt-state/ に記録し、actions/cache で持ち回る
# - 決定的な網羅層は UTC の時（0〜23）の区画を回す。Kotlin の版は (時 + 日) % 版の数 で選び、1 日ずつずらす（ADR-055）。
#   同じ区画が毎日同じ版に当たらず、版の数 × 24 時間で「全版 × 全区画」が一巡する。網羅は .pbt-state/coverage/<版>/<時>/ に版ごとに残す
# - 反例が出たら build/pbt/failures を artifact にし、issue（ラベル pbt-counterexample）を作る。open は 1 つだけ、続けて出たらコメント
name: PBT hourly

on:
  # schedule は default branch（main）のファイルだけが効く。動かないときは .github/CI.md「schedule が動かないとき」
  schedule:
    - cron: "17 * * * *" # 毎時 17 分（:00 の混雑を避ける）
  workflow_dispatch:
    inputs:
      budget:
        description: "予算（分）"
        default: "30"

concurrency:
  group: pbt-hourly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  # PBT を持つモジュールのテストタスク。acgCheckAll を使うテストを足したモジュールはここに足す
  PBT_TASKS: ":pbt:test"

jobs:
  pbt:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore timing
        uses: actions/cache/restore@v4
        with:
          path: .pbt-state
          key: pbt-state-${{ github.run_id }}
          restore-keys: pbt-state-
      - name: Pick Kotlin version and shard
        id: plan
        run: |
          epoch_hours=$(( $(date -u +%s) / 3600 ))
          hour=$(( epoch_hours % 24 ))
          day=$(( epoch_hours / 24 ))
          mapfile -t versions < <(python3 scripts/kotlin-versions.py matrix full | python3 -c 'import json,sys; print("\n".join(json.load(sys.stdin)))')
          echo "kotlin=${versions[$(( (hour + day) % ${#versions[@]} ))]}" >> "$GITHUB_OUTPUT"
          echo "shard=$hour" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"
          echo "start=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - name: Run PBT
        run: |
          ./gradlew $PBT_TASKS --continue --console=plain \
            -Pacg.pbt.mode=scheduled \
            -Pacg.pbt.budgetMinutes=${{ inputs.budget || '30' }} \
            -Pacg.pbt.runStartEpochMs=${{ steps.plan.outputs.start }} \
            -Pacg.pbt.shard=${{ steps.plan.outputs.shard }} \
            -Pacg.kotlin=${{ steps.plan.outputs.kotlin }}
      - name: Keep coverage per Kotlin version
        if: always()
        env:
          KOTLIN: ${{ steps.plan.outputs.kotlin }}
          STAMP: ${{ steps.plan.outputs.stamp }}
        run: |
          # XD-11 が版ごとに数える網羅の記録（ADR-055）。版の数 × 24 時間 + 1 日より古いものは消す
          dest=".pbt-state/coverage/$KOTLIN/$STAMP"
          mkdir -p "$dest"
          find . -path '*/build/pbt/coverage/*.tsv' -not -path './.pbt-state/*' -exec cp {} "$dest/" \;
          keep_days=$(( $(python3 scripts/kotlin-versions.py matrix full | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))') + 1 ))
          find .pbt-state/coverage -mindepth 2 -maxdepth 2 -type d -mtime +"$keep_days" -exec rm -rf {} + || true
      - name: Save timing
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .pbt-state
          key: pbt-state-${{ github.run_id }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbt-${{ github.run_id }}
          path: |
            **/build/pbt/**
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
      - name: Report counterexample
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(mktemp)
          found=$(find . -path '*/build/pbt/failures/new-regressions.tsv' -exec cat {} +)
          # 落ちたテストの名前と 1 行目のメッセージ（反例以外の失敗、たとえば時間切れを見分けるため。issue #43）
          failed=$(find . -path '*/build/test-results/*' -name '*.xml' -print0 | xargs -0 -r python3 -c '
          import sys, xml.etree.ElementTree as ET
          for f in sys.argv[1:]:
              for c in ET.parse(f).getroot().iter("testcase"):
                  for e in list(c.findall("failure")) + list(c.findall("error")):
                      msg = (e.get("message") or "").splitlines()
                      print("- " + c.get("classname", "") + " > " + c.get("name", "") + ": " + (msg[0][:200] if msg else ""))
          ')
          {
            if [ -n "$found" ]; then
              echo "毎時の PBT で反例が見つかった（Kotlin ${{ steps.plan.outputs.kotlin }}）。実行: $RUN_URL"
            else
              echo "毎時の PBT が反例以外の理由で落ちた（Kotlin ${{ steps.plan.outputs.kotlin }}）。実行: $RUN_URL"
            fi
            echo
            echo "落ちたテスト:"
            echo "${failed:-（テスト結果なし。ビルドの失敗の可能性）}"
            echo
            echo "回帰ケースにする行（各モジュールの src/test/resources/pbt/regressions/<性質>.tsv に足す）:"
            echo '```'
            echo "${found:-（記録なし。反例ではない）}"
            echo '```'
          } > "$body"
          gh label create pbt-counterexample --color B60205 --description "毎時 PBT の反例（ADR-022）" 2>/dev/null || true
          num=$(gh issue list --label pbt-counterexample --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file "$body"
          else
            gh issue create --title "毎時 PBT の反例" --label pbt-counterexample --body-file "$body"
          fi
