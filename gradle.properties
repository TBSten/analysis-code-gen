org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
# 依存の取得はプロキシの同時接続数を超えないよう 4 本に絞る
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
acg.version=0.1.0-SNAPSHOT
# ケース ID 整合チェック（ADR-030）。true にすると、一覧にあるのにテストが無いケースでも失敗する。
# 全ケースの保留テストがそろったら（ACG-44〜46 の完了時、G0 の条件）true にする
acg.caseCheck.requireAllCases=false
