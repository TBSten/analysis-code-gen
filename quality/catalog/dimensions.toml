# 入力値空間の次元（ADR-020）
#
# 各次元の値には、パターンのソースから自動で付けるための正規表現 `match` を書く。
# `match` が無い値は、パターン先頭の `// TAGS:` で手で付ける。
# `required = true` の値は、網羅表でパターン 0 件だと catalog.py check が失敗する。
# `scope` はその次元を数える対象（"all" は全 Processor 共通、"cream" などはその Processor のパターンだけ）。
#
# 正規表現は Python の re（MULTILINE）。ソースのコメント行（// で始まる行）は取り除いてから当てる。

# ---------------------------------------------------------------- 共通: Kotlin の言語要素

[dim."kt.decl"]
title = "宣言の種類"
scope = "all"
values = [
  { id = "class", match = '(?<![\w.])(?<!data )(?<!value )(?<!enum )(?<!sealed )(?<!annotation )(?<!abstract )(?<!inner )class\s+\w', required = true },
  { id = "data-class", match = '\bdata\s+class\b', required = true },
  { id = "value-class", match = '\bvalue\s+class\b|@JvmInline', required = true },
  { id = "enum-class", match = '\benum\s+class\b', required = true },
  { id = "sealed-class", match = '\bsealed\s+class\b', required = true },
  { id = "sealed-interface", match = '\bsealed\s+interface\b', required = true },
  { id = "interface", match = '(?<!sealed )(?<!fun )\binterface\s+\w', required = true },
  { id = "fun-interface", match = '\bfun\s+interface\b' },
  { id = "abstract-class", match = '\babstract\s+class\b', required = true },
  { id = "object", match = '(?<!companion )(?<!data )\bobject\s+\w', required = true },
  { id = "data-object", match = '\bdata\s+object\b' },
  { id = "companion-object", match = '\bcompanion\s+object\b', required = true },
  { id = "annotation-class", match = '\bannotation\s+class\b' },
  { id = "typealias", match = '^\s*(public |internal |private )?typealias\s', required = true },
  { id = "top-level-fun", match = '^(public |internal |private )?(suspend )?fun\s+(<[^>]+>\s*)?\w+\s*\(', required = true },
  { id = "top-level-property", match = '^(public |internal |private )?(const )?va[lr]\s+\w' },
  { id = "extension-fun", match = '\bfun\s+(<[^>]+>\s*)?[\w.<>?, ]+\.\w+\s*\(' },
  { id = "extension-property", match = '\bva[lr]\s+(<[^>]+>\s*)?[A-Z][\w<>?, ]*\.\w+\s*:' },
  { id = "local-class", match = '\bfun\s+\w+\s*\([^)]*\)[^{]*\{[^}]*\bclass\s+\w' },
  { id = "object-expression", match = '=\s*object\s*:' },
]

[dim."kt.vis"]
title = "可視性"
scope = "all"
values = [
  { id = "public-implicit", match = '^(?!.*\b(private|internal|protected|public)\b).*\b(class|interface|object|fun)\s+\w', required = true },
  { id = "public-explicit", match = '\bpublic\s+(data |sealed |abstract |open |value |enum |inner )?(class|interface|object|fun|val|var)\b' },
  { id = "internal", match = '\binternal\s', required = true },
  { id = "private", match = '\bprivate\s', required = true },
  { id = "protected", match = '\bprotected\s' },
]

[dim."kt.nest"]
title = "入れ子"
scope = "all"
values = [
  { id = "nested", match = '^\s{2,}(public |internal |private )?(data |sealed |enum |value |abstract )?(class|interface|object)\s+\w', required = true },
  { id = "inner", match = '\binner\s+class\b' },
  { id = "deep-nested", match = '^\s{6,}(public |internal |private )?(data |sealed |enum |value |abstract )?(class|interface|object)\s+\w', required = true },
]

[dim."kt.generics"]
title = "ジェネリクス"
scope = "all"
values = [
  { id = "type-param", match = '(class|interface|fun)\s+(<[^>]+>\s*)?\w*<\s*\w+\s*[,>]|fun\s*<\w', required = true },
  { id = "upper-bound", match = '<\s*\w+\s*:\s*\w', required = true },
  { id = "multiple-bounds", match = '\bwhere\s+\w+\s*:' },
  { id = "variance-out", match = '<\s*out\s+\w|,\s*out\s+\w', required = true },
  { id = "variance-in", match = '<\s*in\s+\w|,\s*in\s+\w' },
  { id = "star-projection", match = '<\s*\*\s*>|<\s*\*\s*,|,\s*\*\s*>', required = true },
  { id = "recursive-bound", match = '<\s*(\w+)\s*:\s*\w+<\s*\1\s*>' },
  { id = "nested-generic", match = '\w<[^<>]*\w<[^<>]+>[^<>]*>', required = true },
  { id = "reified", match = '\breified\s' },
]

[dim."kt.types"]
title = "型の形"
scope = "all"
values = [
  { id = "nullable", match = '\w\?(\s|,|\)|>|=)', required = true },
  { id = "list", match = '\b(List|MutableList)<', required = true },
  { id = "set", match = '\b(Set|MutableSet)<' },
  { id = "map", match = '\b(Map|MutableMap)<', required = true },
  { id = "array", match = '\b(Array<|IntArray|ByteArray|LongArray)' },
  { id = "function-type", match = ':\s*(suspend\s*)?\([^)]*\)\s*->', required = true },
  { id = "primitive", match = ':\s*(Int|Long|Double|Float|Boolean|Char|Short|Byte)\b', required = true },
  { id = "unsigned", match = ':\s*U(Int|Long|Short|Byte)\b' },
  { id = "string", match = ':\s*String\b', required = true },
  { id = "platform-type", tag_only = true },
]

[dim."kt.ctor"]
title = "コンストラクタ・引数"
scope = "all"
values = [
  { id = "primary", match = '\bclass\s+\w+(<[^>]*>)?\s*(\w+\s+)*\(', required = true },
  { id = "no-arg", match = '\bclass\s+\w+\s*(\{|$|:)' },
  { id = "secondary", match = '\bconstructor\s*\([^)]*\)\s*:\s*this\(' },
  { id = "private-ctor", match = '\bprivate\s+constructor\b' },
  { id = "default-arg", match = '\b(va[lr]\s+)?\w+\s*:\s*[\w<>?., ]+\s*=\s*[^=>]', required = true },
  { id = "vararg", match = '\bvararg\s' },
  { id = "non-property-param", match = '\bclass\s+\w+\s*\(\s*\w+\s*:' },
]

[dim."kt.prop"]
title = "プロパティ"
scope = "all"
values = [
  { id = "val", match = '\bval\s+\w', required = true },
  { id = "var", match = '\bvar\s+\w', required = true },
  { id = "lateinit", match = '\blateinit\s' },
  { id = "delegated", match = '\bva[lr]\s+\w+(\s*:[^=]+)?\s+by\s' },
  { id = "const", match = '\bconst\s+val\b' },
  { id = "custom-getter", match = '^\s*get\(\)\s*[={]' },
  { id = "body-property", match = '^\s{2,}(override\s+)?va[lr]\s+\w+\s*:\s*[\w<>?]+\s*=' },
  { id = "jvm-field", match = '@JvmField' },
  { id = "override", match = '\boverride\s+va[lr]\b' },
]

[dim."kt.annot"]
title = "アノテーションの書き方"
scope = "all"
values = [
  { id = "use-site-target", match = '@(field|param|get|set|property|file|receiver|setparam|delegate):', required = true },
  { id = "array-arg", match = '@\w+\([^)]*\[[^\]]*\]', required = true },
  { id = "class-literal-arg", match = '@\w+\([^)]*::class', required = true },
  { id = "named-arg", match = '@\w+\(\s*\w+\s*=', required = true },
  { id = "repeated", match = '(@(\w+)\b[^\n]*\n\s*@\2\b)' },
  { id = "meta-annotation", match = 'annotation\s+class(?s:.*)@' },
  { id = "fqn-annotation", match = '@[a-z]+\.[a-z.]+\.[A-Z]\w*' },
]

[dim."kt.misc"]
title = "その他の言語要素"
scope = "all"
values = [
  { id = "kdoc", match = '/\*\*', required = true },
  { id = "deprecated", match = '@Deprecated\b' },
  { id = "backtick-name", match = '`[^`]+`' },
  { id = "suspend", match = '\bsuspend\s+fun\b' },
  { id = "expect-actual", match = '\b(expect|actual)\s+(class|fun|val|object|interface)\b' },
  { id = "context-parameters", match = '\bcontext\(' },
  { id = "inheritance", match = '\)\s*:\s*[A-Z]\w*(<[^>]*>)?\s*(\(|\{|$|,)', required = true },
  { id = "opt-in", match = '@OptIn\(|@RequiresOptIn' },
  { id = "jvm-name", match = '@JvmName|@JvmStatic|@JvmOverloads' },
]

[dim."kt.layout"]
title = "ファイル・モジュールの配置"
scope = "all"
values = [
  { id = "single-file", tag_only = true, required = true },
  { id = "multi-file", tag_only = true, required = true },
  { id = "multi-package", tag_only = true, required = true },
  { id = "java-source", tag_only = true, required = true },
  { id = "default-package", tag_only = true },
  { id = "multi-module", tag_only = true, required = true },
  { id = "kmp-common", tag_only = true, required = true },
  { id = "kmp-intermediate", tag_only = true },
  { id = "kmp-platform", tag_only = true, required = true },
  { id = "android", tag_only = true, required = true },
  { id = "test-source-set", tag_only = true },
]

[dim."kt.outcome"]
title = "期待する結果"
scope = "all"
values = [
  { id = "ok", tag_only = true, required = true },
  { id = "processor-error", tag_only = true, required = true },
  { id = "processor-warning", tag_only = true },
  { id = "compile-error", tag_only = true },
]

[dim."proc.combo"]
title = "Processor の組み合わせ"
scope = "all"
values = [
  { id = "single", tag_only = true, required = true },
  { id = "multi", tag_only = true, required = true },
]

