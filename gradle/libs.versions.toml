[versions]
# Kotlin: 最新 stable。対応範囲（2.4.0 以降の全 stable + 最新プレリリース）の切り替えは ADR-011 で決める
kotlin = "2.4.21"
ksp = "2.3.14"
kotest = "6.2.7"
ktlint-gradle = "14.2.0"
# Analysis API（ADR-011）。いまは全モジュールを最新 stable でコンパイルする。analysis-code-gen-processor-api を最小版（2.4.0）でコンパイルする切り替えは ACG-28 の版マトリクスで足す
analysis-api = "2.4.21"
# AA が前提とする IntelliJ Platform の版（KSP2 の aa-intellij に当たる）
aa-intellij = "251.27812.49"
kotlinx-serialization = "1.9.0"
okio = "3.18.2"
classgraph = "4.8.200"
dokka = "2.3.0"
# BRG-11（KotlinPoet の KSP 拡張が Bridge で動く）のテストだけが使う
kotlinpoet = "2.2.0"
# フィクスチャ（fixtures/projects/*）だけが使う Android Gradle Plugin（ADR-027）
agp = "9.0.0"
katachi = "0.4.0"
junit = "5.14.4"
# AA Standalone を実行するときに IntelliJ Platform と一緒に要るライブラリ（KSP2 2.3.14 の kotlin-analysis-api と同じ版。collections-immutable だけ AA 2.4.21 が要る 0.5.0（PersistentList.adding）。ADR-060）
aa-guava = "33.2.0-jre"
aa-asm = "9.0"
aa-stax2 = "4.2.1"
aa-aalto-xml = "1.3.0"
aa-streamex = "0.7.2"
aa-fastutil = "8.5.14-jb1"
aa-jna = "5.9.0.26"
aa-trove4j = "1.0.20200330"
aa-log4j = "1.2.17.2"
aa-jdom = "2.0.6"
aa-coroutines = "1.10.2"
aa-annotations = "24.1.0"
aa-lz4 = "1.7.1"
aa-opentelemetry = "1.34.1"
aa-collections-immutable = "0.5.0"
aa-caffeine = "2.9.3"
aa-javax-inject = "1"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotest-framework-engine = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest" }
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
# kct fork（analysis-code-gen-testing-kct、ADR-021）が使うもの。Kotlin コンパイラの版は -Pacg.kotlin で差し替える（analysis-code-gen-testing-kct/build.gradle.kts）
ksp-impl = { module = "com.google.devtools.ksp:symbol-processing", version.ref = "ksp" }
ksp-aa-embeddable = { module = "com.google.devtools.ksp:symbol-processing-aa-embeddable", version.ref = "ksp" }
ksp-common-deps = { module = "com.google.devtools.ksp:symbol-processing-common-deps", version.ref = "ksp" }
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
classgraph = { module = "io.github.classgraph:classgraph", version.ref = "classgraph" }
kotlinpoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinpoet" }

kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }

# Analysis API と IntelliJ Platform（非推移で使う。acg.analysis-api convention plugin が追加する）
aa-api = { module = "org.jetbrains.kotlin:analysis-api-for-ide", version.ref = "analysis-api" }
aa-compiler-common = { module = "org.jetbrains.kotlin:kotlin-compiler-common-for-ide", version.ref = "analysis-api" }
ij-core = { module = "com.jetbrains.intellij.platform:core", version.ref = "aa-intellij" }
ij-core-impl = { module = "com.jetbrains.intellij.platform:core-impl", version.ref = "aa-intellij" }
ij-util = { module = "com.jetbrains.intellij.platform:util", version.ref = "aa-intellij" }
ij-util-base = { module = "com.jetbrains.intellij.platform:util-base", version.ref = "aa-intellij" }
ij-util-rt = { module = "com.jetbrains.intellij.platform:util-rt", version.ref = "aa-intellij" }
ij-extensions = { module = "com.jetbrains.intellij.platform:extensions", version.ref = "aa-intellij" }
ij-java-psi = { module = "com.jetbrains.intellij.java:java-psi", version.ref = "aa-intellij" }
ij-java-frontback-psi = { module = "com.jetbrains.intellij.java:java-frontback-psi", version.ref = "aa-intellij" }
# AA Standalone の環境構築（analysis-code-gen-analysis-engine）が compileOnly で使う（ADR-060）
aa-standalone = { module = "org.jetbrains.kotlin:analysis-api-standalone-for-ide", version.ref = "analysis-api" }
aa-platform-interface = { module = "org.jetbrains.kotlin:analysis-api-platform-interface-for-ide", version.ref = "analysis-api" }
aa-impl-base = { module = "org.jetbrains.kotlin:analysis-api-impl-base-for-ide", version.ref = "analysis-api" }
aa-k2 = { module = "org.jetbrains.kotlin:analysis-api-k2-for-ide", version.ref = "analysis-api" }
aa-low-level-api-fir = { module = "org.jetbrains.kotlin:low-level-api-fir-for-ide", version.ref = "analysis-api" }
aa-symbol-light-classes = { module = "org.jetbrains.kotlin:symbol-light-classes-for-ide", version.ref = "analysis-api" }
aa-compiler-fir = { module = "org.jetbrains.kotlin:kotlin-compiler-fir-for-ide", version.ref = "analysis-api" }
aa-compiler-fe10 = { module = "org.jetbrains.kotlin:kotlin-compiler-fe10-for-ide", version.ref = "analysis-api" }
aa-compiler-ir = { module = "org.jetbrains.kotlin:kotlin-compiler-ir-for-ide", version.ref = "analysis-api" }
ij-util-loader = { module = "com.jetbrains.intellij.platform:util-class-loader", version.ref = "aa-intellij" }
ij-util-text-matching = { module = "com.jetbrains.intellij.platform:util-text-matching", version.ref = "aa-intellij" }
ij-util-coroutines = { module = "com.jetbrains.intellij.platform:util-coroutines", version.ref = "aa-intellij" }
ij-util-xml-dom = { module = "com.jetbrains.intellij.platform:util-xml-dom", version.ref = "aa-intellij" }
ij-diagnostic = { module = "com.jetbrains.intellij.platform:diagnostic", version.ref = "aa-intellij" }
ij-diagnostic-telemetry = { module = "com.jetbrains.intellij.platform:diagnostic-telemetry", version.ref = "aa-intellij" }
ij-java-frontback-psi-impl = { module = "com.jetbrains.intellij.java:java-frontback-psi-impl", version.ref = "aa-intellij" }
ij-java-psi-impl = { module = "com.jetbrains.intellij.java:java-psi-impl", version.ref = "aa-intellij" }
# AA Standalone を実行するときに要る第三者ライブラリ（非推移で使う）
aa-dep-guava = { module = "com.google.guava:guava", version.ref = "aa-guava" }
aa-dep-asm = { module = "org.jetbrains.intellij.deps:asm-all", version.ref = "aa-asm" }
aa-dep-stax2 = { module = "org.codehaus.woodstox:stax2-api", version.ref = "aa-stax2" }
aa-dep-aalto-xml = { module = "com.fasterxml:aalto-xml", version.ref = "aa-aalto-xml" }
aa-dep-streamex = { module = "one.util:streamex", version.ref = "aa-streamex" }
aa-dep-fastutil = { module = "org.jetbrains.intellij.deps.fastutil:intellij-deps-fastutil", version.ref = "aa-fastutil" }
aa-dep-jna = { module = "org.jetbrains.intellij.deps.jna:jna", version.ref = "aa-jna" }
aa-dep-jna-platform = { module = "org.jetbrains.intellij.deps.jna:jna-platform", version.ref = "aa-jna" }
aa-dep-trove4j = { module = "org.jetbrains.intellij.deps:trove4j", version.ref = "aa-trove4j" }
aa-dep-log4j = { module = "org.jetbrains.intellij.deps:log4j", version.ref = "aa-log4j" }
aa-dep-jdom = { module = "org.jetbrains.intellij.deps:jdom", version.ref = "aa-jdom" }
aa-dep-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm", version.ref = "aa-coroutines" }
aa-dep-annotations = { module = "org.jetbrains:annotations", version.ref = "aa-annotations" }
aa-dep-lz4 = { module = "org.lz4:lz4-java", version.ref = "aa-lz4" }
aa-dep-opentelemetry = { module = "io.opentelemetry:opentelemetry-api", version.ref = "aa-opentelemetry" }
aa-dep-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable-jvm", version.ref = "aa-collections-immutable" }
aa-dep-caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "aa-caffeine" }
aa-dep-javax-inject = { module = "javax.inject:javax.inject", version.ref = "aa-javax-inject" }
katachi = { module = "me.tbsten.katachi:katachi", version.ref = "katachi" }
katachiKonsist = { module = "me.tbsten.katachi:katachi-konsist", version.ref = "katachi" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[bundles]
# AA Standalone を動かす実行時の一式（*-for-ide・IntelliJ Platform・第三者ライブラリ）。非推移で使う。
# engine-tests の実行時クラスパスと、Gradle plugin が Worker に載せる一覧の正（ADR-011・060）
aa-runtime = [
    "aa-api", "aa-compiler-common", "aa-standalone", "aa-platform-interface", "aa-impl-base", "aa-k2",
    "aa-low-level-api-fir", "aa-symbol-light-classes", "aa-compiler-fir", "aa-compiler-fe10", "aa-compiler-ir",
    "ij-core", "ij-core-impl", "ij-util", "ij-util-base", "ij-util-rt", "ij-extensions", "ij-java-psi", "ij-java-frontback-psi",
    "ij-util-loader", "ij-util-text-matching", "ij-util-coroutines", "ij-util-xml-dom", "ij-diagnostic",
    "ij-diagnostic-telemetry", "ij-java-frontback-psi-impl", "ij-java-psi-impl",
    "aa-dep-guava", "aa-dep-asm", "aa-dep-stax2", "aa-dep-aalto-xml", "aa-dep-streamex", "aa-dep-fastutil", "aa-dep-jna",
    "aa-dep-jna-platform", "aa-dep-trove4j", "aa-dep-log4j", "aa-dep-jdom", "aa-dep-coroutines", "aa-dep-annotations",
    "aa-dep-lz4", "aa-dep-opentelemetry", "aa-dep-collections-immutable", "aa-dep-caffeine", "aa-dep-javax-inject",
]
# analysis-code-gen-analysis-engine が acg.analysis-api の一式に足して compileOnly で使うもの
aa-standalone-compile = [
    "aa-standalone", "aa-platform-interface", "aa-impl-base", "aa-k2", "aa-low-level-api-fir", "aa-compiler-fir",
    "aa-compiler-ir", "ij-java-psi-impl", "ij-java-frontback-psi-impl",
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# 以下はフィクスチャ（fixtures/projects/*）が使う（ADR-027）
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
katachi = { id = "me.tbsten.katachi", version.ref = "katachi" }
